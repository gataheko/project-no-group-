name: .NET build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore dependencies
        run: dotnet restore SmallBusinessInventory.csproj
      - name: Build
        run: dotnet build SmallBusinessInventory.csproj --no-restore --configuration Release
